name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with the wails version in go.mod.
  WAILS_VERSION: v2.16.0

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # CGO deps for Wails (GTK3 + WebKit2GTK 4.1 + libsoup 3) and go-sqlite3.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # main.go embeds frontend/dist, so this must exist before any Go step.
      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # Generates the (git-ignored) frontend/wailsjs bindings so the drift check
      # between the test mock and the real bindings runs instead of being skipped.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Generate Wails bindings
        run: wails generate module -tags webkit2_41

      - name: Frontend tests
        run: npm test
        working-directory: frontend

      - name: Go vet
        run: go vet -tags webkit2_41 ./...

      # Race detector on: some tests only catch regressions under -race.
      - name: Go tests
        run: go test -race -tags webkit2_41 ./...

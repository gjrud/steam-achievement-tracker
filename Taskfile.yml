version: '3'

vars:
  APP_NAME: "steam-achievement-tracker"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Package/app version, shared by build/linux and build/windows (included Taskfile vars share one namespace, so define
  # it once). `VERSION` wins, else the vX.Y.Z tag that points at HEAD, without the "v". Empty when neither exists:
  # production package tasks then fail through a precondition. The var itself must not fail, because Task evaluates it for
  # every task, including build and dev. --match ignores non-version tags such as "nightly".
  PKG_VERSION:
    sh: |
      v="${VERSION:-$(git describe --tags --exact-match --match 'v[0-9]*' HEAD 2>/dev/null || true)}"
      echo "${v#v}"

includes:
  common: ./build/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  windows: ./build/windows/Taskfile.yml

# build, package and run dispatch to the current OS (linux or windows). Platform tasks are in build/<os>/Taskfile.yml.
tasks:
  build:
    summary: Builds the application for the current OS
    cmds:
      - task: '{{OS}}:build'

  package:
    summary: Packages a production build of the application for the current OS
    cmds:
      - task: '{{OS}}:package'

  run:
    summary: Runs the application
    cmds:
      - task: '{{OS}}:run'

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker
